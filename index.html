<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoreWeaver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="breadcrumb-wrap">
        <nav id="breadcrumb" aria-label="Navigation path"></nav>
      </div>
      <div id="search-wrap">
        <input id="search-input" type="search" placeholder="Search entities…" autocomplete="off">
        <div id="search-results" role="listbox" aria-live="polite"></div>
      </div>
      <div id="topbar-actions">
        <button id="btn-nav-back"     class="btn-topbar" title="Go back" style="display:none">← Back</button>
        <button id="btn-new-entity"   class="btn-topbar" title="Add entity" disabled>＋ Add</button>
        <button id="btn-worlds"       class="btn-topbar" title="Manage worlds">🌐 Worlds</button>
      </div>
    </header>

    <main id="stage">

      <div id="map-view" class="stage-view">
        <div id="map-wrap">
          <div id="map-bg"></div>
          <div id="markers-layer"></div>
        </div>
      </div>

      <div id="list-view" class="stage-view">
        <div id="list-grid"></div>
      </div>

      <div id="empty-state" class="stage-view">
        <div class="empty-inner">
          <div class="empty-glyph">🌍</div>
          <h2>No worlds yet</h2>
          <p>Create your first world to start weaving your lore.</p>
          <button id="btn-create-first-world" class="btn-primary">Create World</button>
        </div>
      </div>

      <aside id="sidebar">
        <button id="btn-sidebar-close" class="btn-icon" title="Close (Esc)">×</button>
        <div id="sidebar-content"></div>
      </aside>

    </main>
  </div>

  <!-- Entity editor modal -->
  <div id="modal-overlay" class="overlay" aria-hidden="true">
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-header">
        <h3 id="modal-title">Entity</h3>
        <button id="btn-modal-close" class="btn-icon" title="Close">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- World manager overlay -->
  <div id="world-modal-overlay" class="overlay" aria-hidden="true">
    <div id="world-modal" role="dialog" aria-modal="true">
      <div id="world-modal-header">
        <h3>Worlds</h3>
        <button id="btn-world-modal-close" class="btn-icon" title="Close">×</button>
      </div>
      <div id="world-modal-body">
        <div id="world-list"></div>
        <div id="world-modal-footer">
          <button id="btn-import-world" class="btn-ghost">↥ Import .json</button>
          <button id="btn-create-world" class="btn-primary">＋ New World</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Context menu -->
  <div id="ctx-menu" role="menu" aria-hidden="true">
    <ul id="ctx-list"></ul>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/map.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
